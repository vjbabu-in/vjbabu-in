<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | VjBabu Technologies</title>

<meta name="description"
content="Login to Learn With Vijay and VjBabu Technologies.">

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="logo">

<h1>VjBabu<span>Tech</span></h1>

<p>Welcome Back 👋</p>

</div>

<form id="loginForm">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
placeholder="Password"
required>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button
type="submit"
class="login-btn">

Login

</button>

<p class="register-text">

Don't have an account?

<a href="register.html">

Register Now

</a>

</p>

</form>

</div>

</div>

<script src="js/login.js"></script>

</body>

</html>
