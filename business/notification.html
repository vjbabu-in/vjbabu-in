<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}
body{
background:#0f172a;
color:#fff;
padding:40px;
}
.container{
max-width:800px;
margin:auto;
}
h1{
text-align:center;
margin-bottom:30px;
}
.notification{
background:#1e293b;
padding:20px;
margin-bottom:20px;
border-radius:15px;
border-left:5px solid #3b82f6;
}
.notification h3{
margin-bottom:8px;
}
.time{
font-size:13px;
color:#94a3b8;
margin-top:8px;
}
.btn{
display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#2563eb;
color:#fff;
text-decoration:none;
border-radius:10px;
}
</style>

</head>

<body>

<div class="container">

<h1>Notifications</h1>

<div class="notification">
<h3>🎉 Booking Confirmed</h3>
<p>Your Business Website booking has been confirmed.</p>
<div class="time">Today • 10:15 AM</div>
</div>

<div class="notification">
<h3>🚀 Project Updated</h3>
<p>Your project has reached 75% completion.</p>
<div class="time">Yesterday • 6:20 PM</div>
</div>

<div class="notification">
<h3>💳 Payment Received</h3>
<p>Your payment of ₹9,999 was received successfully.</p>
<div class="time">22 Sep 2026</div>
</div>

<a href="dashboard.html" class="btn">Back to Dashboard</a>

</div>

</body>
</html>
