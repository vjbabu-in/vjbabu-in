<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f172a;
color:#fff;
padding:40px;
}

.container{
max-width:700px;
margin:auto;
background:#1e293b;
padding:30px;
border-radius:20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.setting{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
border-bottom:1px solid #334155;
}

.switch{
width:50px;
height:26px;
background:#475569;
border-radius:20px;
position:relative;
cursor:pointer;
}

.switch::after{
content:"";
position:absolute;
width:20px;
height:20px;
background:white;
border-radius:50%;
top:3px;
left:3px;
transition:.3s;
}

.switch.active{
background:#22c55e;
}

.switch.active::after{
left:27px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:12px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Settings</h1>

<div class="setting">
<span>Dark Mode</span>
<div class="switch active"></div>
</div>

<div class="setting">
<span>Email Notifications</span>
<div class="switch active"></div>
</div>

<div class="setting">
<span>SMS Notifications</span>
<div class="switch"></div>
</div>

<div class="setting">
<span>Project Updates</span>
<div class="switch active"></div>
</div>

<a href="dashboard.html" class="btn">Back to Dashboard</a>

</div>

sw.onclick=()=>{
sw.classList.toggle("active");
