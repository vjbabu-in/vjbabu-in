<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0f172a;color:#fff}
header{
background:#1e293b;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}
.container{
padding:30px;
}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin:30px 0;
}
.card{
background:#1e293b;
padding:25px;
border-radius:15px;
text-align:center;
}
.card h2{
font-size:35px;
margin-bottom:10px;
color:#60a5fa;
}
table{
width:100%;
border-collapse:collapse;
background:#1e293b;
border-radius:10px;
overflow:hidden;
}
th,td{
padding:15px;
border-bottom:1px solid #334155;
text-align:left;
}
th{
background:#2563eb;
}
.status{
color:#22c55e;
font-weight:bold;
}
.btn{
display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:10px;
}
</style>
</head>
<body>

<a href="index.html" class="btn">Home</a>
</header>

</div>

</div>
