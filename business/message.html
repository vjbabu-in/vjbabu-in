<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Messages</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
background:#0f172a;
color:#fff;
padding:30px;
}
.container{
max-width:900px;
margin:auto;
}
h1{
margin-bottom:25px;
text-align:center;
}
.message{
background:#1e293b;
padding:20px;
margin-bottom:20px;
border-radius:15px;
}
.message h3{
color:#60a5fa;
margin-bottom:8px;
}
.time{
font-size:13px;
color:#94a3b8;
margin-bottom:10px;
}
.btn{
display:inline-block;
margin-top:20px;
padding:12px 22px;
background:#2563eb;
color:#fff;
text-decoration:none;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Client Messages</h1>

<div class="message">
<h3>Rahul Kumar</h3>
<div class="time">Today - 10:30 AM</div>
<p>Hello, I would like to discuss a business website for my company.</p>
</div>

<div class="message">
<h3>Priya Sharma</h3>
<div class="time">Yesterday - 4:15 PM</div>
<p>Please share the quotation for an e-commerce website.</p>
</div>

<div class="message">
<h3>Kiran</h3>
<div class="time">2 Days Ago</div>
<p>When will my project be completed?</p>
</div>

<a href="dashboard.html" class="btn">Back to Dashboard</a>

</div>

</body>
</html>
