<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports & Analytics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}
body{
background:#0f172a;
color:#fff;
padding:40px;
}
.container{
max-width:1000px;
margin:auto;
}
h1{
text-align:center;
margin-bottom:30px;
}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}
.card{
background:#1e293b;
padding:25px;
border-radius:15px;
text-align:center;
}
.card h2{
font-size:34px;
color:#3b82f6;
margin-bottom:10px;
}
.bar{
height:12px;
background:#334155;
border-radius:10px;
overflow:hidden;
margin-top:12px;
}
.fill{
height:100%;
background:#22c55e;
width:80%;
}
.btn{
display:inline-block;
margin-top:30px;
padding:12px 20px;
background:#2563eb;
color:#fff;
text-decoration:none;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Reports & Analytics</h1>

<div class="cards">

<div class="card">
<h2>145</h2>
<p>Total Clients</p>
<div class="bar"><div class="fill"></div></div>
</div>

<div class="card">
<h2>89</h2>
<p>Completed Projects</p>
<div class="bar"><div class="fill" style="width:89%"></div></div>
</div>

<div class="card">
<h2>₹4.8L</h2>
<p>Total Revenue (Demo)</p>
<div class="bar"><div class="fill" style="width:75%"></div></div>
</div>

<div class="card">
<h2>98%</h2>
<p>Client Satisfaction</p>
<div class="bar"><div class="fill" style="width:98%"></div></div>
</div>

</div>

<a href="dashboard.html" class="btn">⬅ Back to Dashboard</a>

</div>

</body>
</html>
